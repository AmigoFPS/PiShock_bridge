[package]
name = "pishock_bridge"
version = "0.1.0"
edition = "2024"
description = "VRChat contacts to PiShock devices"
build = "build.rs"
authors = ["Amigo_FPS"]

[dependencies]
anyhow = "1"
mdns-sd = "0.20"
if-addrs = "0.15"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
reqwest = { version = "0.13", features = ["json"] }
rosc = "0.11"
serde_json = "1"
socket2 = "0.6"
fastrand = "2"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
winresource = "0.1"
